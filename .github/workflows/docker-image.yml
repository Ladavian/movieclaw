# =============================================================================
# Docker 镜像发布流水线
#
# 手动触发（Actions → docker-image → Run workflow），输入镜像标签后：
# 在 amd64 / arm64 原生 runner 上分别构建，再合并为一个多架构 manifest，
# 推送到 Docker Hub（docker.io/<DOCKERHUB_USERNAME>/movieclaw）。
#
# 为什么不用 QEMU 单机跨构建：Next.js 构建与 QEMU 模拟阶段并行时会间歇性
# 挂死（详见 scripts/build-image.sh 头注释）。公开仓库的 arm64 原生 runner
# 免费，两边都原生构建，又快又稳。
#
# 何时触发：docker/runtime-version 被 bump 并合并后（见发布规范），
# 由维护者手动 Run workflow。日常应用发版走 release.yml，不发镜像。
#
# 依赖的仓库配置（Settings → Secrets and variables → Actions）：
#   变量  DOCKERHUB_USERNAME  Docker Hub 用户名（镜像命名空间）
#   机密  DOCKERHUB_TOKEN     Docker Hub 访问令牌（Read & Write 权限）
#   机密  TMDB_API_KEY        烧进镜像的默认 TMDB Key
# =============================================================================
name: docker-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（如 v0.2.0，一般与当时的应用版本一致）"
        required: true

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/movieclaw

jobs:
  # 每个架构在自己的原生 runner 上构建，先只按 digest 推送（不打标签），
  # 最后由 merge 作业把两个 digest 合成一个多架构 manifest 再打标签。
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并按 digest 推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Next.js 构建的并行 worker 靠 /dev/shm 通信，默认 64MB 会静默死锁
          shm-size: 2g
          build-args: |
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: 导出 digest 供合并作业使用
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 只为读 docker/runtime-version，给镜像补一个 runtime-N 标签
      - uses: actions/checkout@v4

      - name: 下载各架构 digest
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 合并多架构 manifest 并打标签推送
        working-directory: /tmp/digests
        run: |
          RUNTIME="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/docker/runtime-version")"
          docker buildx imagetools create \
            -t "$IMAGE:${{ inputs.tag }}" \
            -t "$IMAGE:runtime-$RUNTIME" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: 检查推送结果
        run: docker buildx imagetools inspect "$IMAGE:${{ inputs.tag }}"
